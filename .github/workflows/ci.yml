name: ci

on: [push, pull_request]

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare reference environment
        run: scripts/setup-dev.sh --system
      - uses: Swatinem/rust-cache@v2
      - run: scripts/verify.sh full --output target/ci-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: target/ci-evidence
          if-no-files-found: warn
  minimum-rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/setup-dev.sh --system
      - uses: dtolnay/rust-toolchain@1.92.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo +1.92.0 check --workspace --all-targets --locked
