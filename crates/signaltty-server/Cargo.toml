[package]
name = "signaltty-server"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "signaltty-server"
path = "src/main.rs"

[dependencies]
signaltty-agent.workspace = true
signaltty-core.workspace = true
signaltty-plugin.workspace = true
signaltty-proto.workspace = true
signaltty-term.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
portable-pty = "0.8"
base64 = "0.22"
nix = { version = "0.29", features = ["signal", "process", "user"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
signaltty-testkit.workspace = true
