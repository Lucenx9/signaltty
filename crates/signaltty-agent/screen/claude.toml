# Ported from herdr (https://github.com/herdrdev/herdr) src/detect/manifests/claude.toml
# at commit 2563803, Copyright herdr contributors, Apache-2.0
# (https://www.apache.org/licenses/LICENSE-2.0). Changes: herdr `contains`
# lists (all must appear) become case-insensitive escaped regexes in `all`;
# `line_regex` becomes a `(?m)` regex with `\s` narrowed to `[ \t]` so it
# stays on one line; nested any/all gates become alternations, order-free
# `(?is)a.*b|b.*a` pairs, or split rules; `unknown` + `skip_state_update`
# becomes `state = "hold"`; regions map to `title`, `bottom`, `screen`,
# `prompt_box`, `above_prompt_box` (`lines = 1` for herdr's
# last_non_empty_above_prompt_box) and `after_last_rule`. herdr's
# `osc_progress_idle` is omitted (signaltty does not track OSC 9;4), and its
# known-agent idle fallback is the explicit `idle_fallback` rule.

[agent]
kind = "claude"

[[screen]]
id = "osc_title_working"
state = "working"
priority = 1100
region = "title"
# Braille covers <= 2.1.227; half-circles are the 2.1.228 busy spinner.
regex = ['^[\x{2800}-\x{28FF}\x{25D0}-\x{25D3}] ']

[[screen]]
id = "live_turn_working"
state = "working"
priority = 970
lines = 12
regex = [
  '(?m)^[ \t]*[⏸⏵].*esc to interrupt(?:[ \t]|·|$)',
  '(?m)^[ \t]*[\x{002A}\x{00B7}\x{2722}\x{2733}\x{2736}\x{273B}\x{273D}][ \t]+\S.*…(?:[ \t]+\(\d+[smh](?:[ \t]|·)|[ \t]*$)',
]

[[screen]]
id = "background_agents_working"
state = "working"
priority = 965
region = "above_prompt_box"
lines = 1
regex = ['^[ \t]*[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+Waiting for [1-9]\d* background agents? to finish[ \t]*$']

[[screen]]
id = "background_mcp_task_working"
state = "working"
priority = 965
lines = 12
# Claude renders activity summaries at column zero; wrapped continuations are indented.
regex = ['(?m)^[\x{002A}\x{00B7}\x{2722}\x{2736}\x{273B}\x{273D}][ \t]+\S[^\n]*?(?:\n[ \t]+[^\n]*?){0,3}·(?:[ \t]+|\n[ \t]*)[1-9]\d*(?:[ \t]+|\n[ \t]*)MCP(?:[ \t]+|\n[ \t]*)tasks?(?:[ \t]+|\n[ \t]*)still(?:[ \t]+|\n[ \t]*)running[ \t]*$']
not = [
  '(?i)do you want to proceed\?',
  '(?i)esc to cancel',
  '(?i)waiting for permission',
  '(?i)do you want to allow this connection\?',
  '(?i)tab to amend',
  '(?i)ctrl\+e to explain',
]

[[screen]]
id = "btw_overlay_working"
state = "working"
priority = 975
lines = 5
all = ['(?m)^[ \t]*/btw(?:[ \t]|$)', '(?im)esc to close[ \t]*$']

[[screen]]
id = "transcript_viewer"
state = "hold"
priority = 1000
lines = 3
all = [
  '(?i)showing detailed transcript',
  '(?is)ctrl\+o.*to toggle|to toggle.*ctrl\+o|ctrl\+e.*show all|show all.*ctrl\+e|ctrl\+e.*collapse|collapse.*ctrl\+e|↑↓ scroll|\? for shortcuts',
]

# herdr live_blocked_form, first branch.
[[screen]]
id = "live_blocked_form"
state = "blocked"
priority = 980
region = "after_last_rule"
all = ['(?i)esc to cancel', '(?i)enter to confirm']

# herdr live_blocked_form, second branch ("arrow keys to navigate" covers
# "tab/arrow keys to navigate").
[[screen]]
id = "live_blocked_form_select"
state = "blocked"
priority = 980
region = "after_last_rule"
all = [
  '(?i)esc to cancel',
  '(?i)enter to select',
  '(?i)arrow keys to navigate|arrows to navigate|↑/↓ to navigate|↑↓ to navigate',
]

[[screen]]
id = "dynamic_workflow_prompt"
state = "blocked"
priority = 980
region = "screen"
all = ['(?i)run a dynamic workflow\?', '(?i)esc to cancel']

[[screen]]
id = "mcp_elicitation_prompt"
state = "blocked"
priority = 980
region = "screen"
# MCP elicitation dialogs show Accept/Decline with an "Esc to cancel" footer
# but no Enter hint, so live_blocked_form cannot see them (herdr #3283).
all = [
  '(?i)esc to cancel',
  '(?im)^[ \t]*MCP server ["\x{201C}].+["\x{201D}] requests your input[ \t]*$',
  '(?m)^[ \t]*\x{276F}?[ \t]*(?:Accept|Decline)\b',
]

[[screen]]
id = "live_prompt_box"
state = "idle"
priority = 950
region = "prompt_box"
regex = ['(?m)^[ \t]*❯']
not = [
  '(?i)enter to select',
  '(?i)esc to cancel',
  '(?i)tab/arrow keys',
  '(?i)arrow keys to navigate',
  '(?i)↑/↓ to navigate',
]

[[screen]]
id = "model_picker_menu"
state = "hold"
priority = 900
region = "screen"
all = ['(?i)select model', '(?i)enter to set as default', '(?i)esc to cancel']
not = ['(?i)do you want to proceed\?', '(?i)enter to select']

[[screen]]
id = "bash_permission_prompt"
state = "blocked"
priority = 850
region = "screen"
# Claude marks the selected option with "❯", so every option allows it.
all = [
  '(?i)do you want to proceed\?',
  '(?i)bash command|bash\(|contains expansion|tab to amend|ctrl\+e to explain',
  '(?im)^[ \t]*❯?[ \t]*(?:yes\b|[12]\.[ \t]*yes\b|[23]\.[ \t]*no\b)',
]

[[screen]]
id = "generic_permission_prompt"
state = "blocked"
priority = 840
region = "after_last_rule"
all = [
  '(?i)do you want to proceed\?',
  '(?i)esc to cancel',
  '(?im)^[ \t]*(?:❯?[ \t]*1\.[ \t]*yes\b|2\.[ \t]*yes\b|[23]\.[ \t]*no\b)',
]

[[screen]]
id = "legacy_no_prompt_blocker"
state = "blocked"
priority = 300
region = "screen"
regex = [
  '(?is)do you want to.*(?:yes|❯)|(?:yes|❯).*do you want to',
  '(?is)would you like to.*(?:yes|❯)|(?:yes|❯).*would you like to',
  '(?i)waiting for permission',
  '(?i)do you want to allow this connection\?',
  '(?i)tab to amend',
  '(?i)ctrl\+e to explain',
  '(?is)do you want to proceed\?.*esc to cancel|esc to cancel.*do you want to proceed\?',
  '(?i)review your answers',
  '(?i)skip interview and plan immediately',
]
not = ['(?m)^[ \t]*❯[ \t]*$']

[[screen]]
id = "osc_title_idle"
state = "idle"
priority = 250
region = "title"
regex = ['^\x{2733} ']

[[screen]]
id = "idle_fallback"
state = "idle"
priority = -1000
regex = ['']
