# Ported from herdr (https://github.com/herdrdev/herdr) src/detect/manifests/qodercli.toml
# at commit 2563803, Copyright herdr contributors, Apache-2.0
# (https://www.apache.org/licenses/LICENSE-2.0). Changes: a generic manifest
# scoped to herdr's binary names (spec 033); `contains` lists (all must appear)
# become case-insensitive escaped regexes in `all`; `line_regex` becomes a
# `(?m)` regex with `\s` narrowed to `[ \t]`; nested any/all gates become
# alternations, `(?is)a.*b|b.*a` pairs or split rules; `whole_recent` becomes
# `lines = 200`; herdr's known-agent idle fallback is the explicit
# `idle_fallback` rule.

[agent]
kind = "generic"
binaries = ["qodercli", "qoderclicn", "qoder", "qodercn"]

[[screen]]
id = "confirmation_or_input_blocker"
state = "blocked"
priority = 300
lines = 200
regex = [
  '(?is)waiting for user confirmation.*(?:yes|no|allow|reject)|(?:yes|no|allow|reject).*waiting for user confirmation',
  '(?is)awaiting approval.*(?:allow|reject)|(?:allow|reject).*awaiting approval',
  '(?i)permission required',
  '(?i)allow once or always\?',
  '(?i)asking user',
  '(?i)enter your response',
  '(?i)review your answers:',
  '(?i)shell awaiting input',
]

[[screen]]
id = "cancel_hint_working"
state = "working"
priority = 100
lines = 200
regex = ['(?i)\(esc to cancel,']

[[screen]]
id = "spinner_working"
state = "working"
priority = 90
lines = 200
regex = ['(?m)^[ \t]*[\x{2800}-\x{28FF}][ \t]+.*\p{Alphabetic}']

[[screen]]
id = "idle_fallback"
state = "idle"
priority = -1000
regex = ['']
