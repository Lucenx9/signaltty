# Changes: generic program scope; contains -> case-insensitive all regexes;
# whole_recent -> screen(200), osc_title -> title; line_regex -> multiline;
# nested any/all -> alternatives or split rules; explicit known-agent idle fallback.
# Source: https://github.com/herdrdev/herdr/blob/2563803/src/detect/manifests/grok.toml

[agent]
kind = "generic"
display_name = "Grok"
binaries = ["grok", "grok-build"]

# Evidence: Grok Build 0.2.101 source and 1.0.34 live pane reads.
#
# Grok emits OSC 0 titles by default. Idle is "grok" or
# "<session> - grok". During a turn, the configured title gains a braille
# spinner and activity text. Permission prompts add "⚠ Action Required";
# that prefix blinks while the terminal is unfocused, so visible blocker
# rules outrank the title spinner rule.
#
# Grok also emits OSC 9;4 progress on supported terminals. Herdr retains the
# payload after "9;": "4;1;-1" while busy and "4;0;0" when idle.
#
# Working turns render one live status line directly above the prompt box:
#   "⠧ Waiting on subagent… 2.8s   13s ⇣29.7k [stop]"
#   "⠴ Explore /tmp/… + 1 more… 5.6s   19s ⇣29.7k [stop]"
# with a braille spinner and a trailing [stop] chip, plus an Esc:cancel
# footer hint. Permission prompts and ask-user-question dialogs replace the
# spinner with "◆" and draw a "┃"-guttered option list:
#   "┃  2 (○) Yes, proceed"
#   "┃  z (○) Type your answer here"
# with footer hints "1/3:select │ Ctrl+o:yolo │ Ctrl+c:cancel" (permission)
# or "Esc:unselect │ Tab:scrollback │ Shift+x:dismiss" (question dialog).
# Idle footers end with "Ctrl+.:shortcuts" and never contain "Esc:cancel".
# The startup splash draws its logo with braille characters, so working
# rules must anchor on the [stop] chip, not on a bare spinner glyph.

[[screen]]
id = "osc_title_blocked"
state = "blocked"
priority = 1300
region = "title"
all = ['(?i)Action Required']

[[screen]]
id = "option_dialog_blocked"
state = "blocked"
priority = 1200
region = "screen"
lines = 200
regex = ['(?m)^[ \t]*┃[ \t]+[0-9a-z]+[ \t]+\([●○]\)[ \t]']

[[screen]]
id = "permission_hints_blocked"
state = "blocked"
priority = 1190
region = "bottom"
lines = 2
all = ['(?i):select', '(?i)ctrl\+o:yolo', '(?i)ctrl\+c:cancel']

[[screen]]
id = "question_dialog_hints_blocked"
state = "blocked"
priority = 1185
region = "bottom"
lines = 2
all = ['(?i)tab:scrollback', '(?i)shift\+x:dismiss']

[[screen]]
id = "permission_scope_selector"
state = "blocked"
priority = 1180
region = "screen"
lines = 200
regex = ['(?i)use ← → to choose permission whitelist scope', '(?i)←/→:scope']
all = ['(?i)yes, proceed', '(?i)no, reject']

[[screen]]
id = "osc_progress_working"
state = "working"
priority = 1150
region = "osc_progress"
regex = ['^4;1;-1$']

[[screen]]
id = "osc_title_idle"
state = "idle"
priority = 1100
region = "title"
regex = ['(?:^| - )grok$']
not = ['[\x{2800}-\x{28FF}]']

[[screen]]
id = "osc_title_working"
state = "working"
priority = 1000
region = "title"
regex = ['(?:^|\s)[\x{2801}-\x{28FF}](?:\s|$)']

[[screen]]
id = "osc_progress_idle"
state = "idle"
priority = 950
region = "osc_progress"
regex = ['^4;0;0$']

[[screen]]
id = "spinner_status_working"
state = "working"
priority = 1160
region = "screen"
lines = 200
regex = ['(?m)^[ \t]*[\x{2801}-\x{28FF}][ \t].*\[stop\][ \t]*$']

[[screen]]
id = "esc_cancel_hints_working"
state = "working"
priority = 1155
region = "bottom"
lines = 2
regex = ['(?i)esc:cancel', '(?i)ctrl\+c:cancel']
all = ['(?i)ctrl\+\.:shortcuts']

[[screen]]
id = "waiting_tool_working"
state = "working"
priority = 1140
region = "screen"
lines = 200
all = ['(?i)ctrl\+c:cancel', '(?i)ctrl\+enter:interject', '(?i)waiting']

[[screen]]
id = "waiting_tool_working_line"
state = "working"
priority = 1140
region = "screen"
lines = 200
regex = ['(?m)^[ \t]*[\x{2801}-\x{28FF}][ \t]+(Run|Read|Search|List)\b']

[[screen]]
id = "prompt_hints_idle"
state = "idle"
priority = 100
region = "bottom"
lines = 2
all = ['(?i)ctrl\+\.:shortcuts']
not = ['(?i)esc:cancel', '(?i)ctrl\+c:cancel']

[[screen]]
id = "idle_fallback"
state = "idle"
region = "screen"
regex = ['']
priority = -1000
