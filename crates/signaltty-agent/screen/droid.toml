# Ported from herdr (https://github.com/herdrdev/herdr) src/detect/manifests/droid.toml
# at commit 2563803, Copyright herdr contributors, Apache-2.0
# (https://www.apache.org/licenses/LICENSE-2.0). Changes: a generic manifest
# scoped to herdr's binary names (spec 033); `contains` lists (all must appear)
# become case-insensitive escaped regexes in `all`; `line_regex` becomes a
# `(?m)` regex with `\s` narrowed to `[ \t]`; nested any/all gates become
# alternations, `(?is)a.*b|b.*a` pairs or split rules; `whole_recent` becomes
# `lines = 200`; herdr's known-agent idle fallback is the explicit
# `idle_fallback` rule.

[agent]
kind = "generic"
display_name = "Droid"
binaries = ["droid"]

# "use ↑↓ to navigate" contains "↑↓ to navigate".
[[screen]]
id = "execute_selection_blocker"
state = "blocked"
priority = 300
lines = 200
all = [
  '(?i)enter to select',
  '(?i)esc to cancel',
  '(?i)↑↓ to navigate',
  '(?i)> yes, allow|> no, cancel',
]

[[screen]]
id = "selection_menu_blocker"
state = "blocked"
priority = 290
lines = 8
all = ['(?i)enter select', '(?i)esc cancel', '(?i)↑/↓ navigate|↑↓ navigate']

[[screen]]
id = "spinner_stop_working"
state = "working"
priority = 110
lines = 200
all = ['(?i)esc to stop', '(?m)^[ \t]*[\x{2800}-\x{28FF}]']

[[screen]]
id = "stop_hint_working"
state = "working"
priority = 100
lines = 200
regex = ['(?i)esc to stop']

[[screen]]
id = "idle_fallback"
state = "idle"
priority = -1000
regex = ['']
