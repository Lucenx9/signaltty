# Ported from herdr (https://github.com/herdrdev/herdr) src/detect/manifests/kilo.toml
# at commit 2563803, Copyright herdr contributors, Apache-2.0
# (https://www.apache.org/licenses/LICENSE-2.0). Changes: a generic manifest
# scoped to herdr's binary names (spec 033); `contains` lists (all must appear)
# become case-insensitive escaped regexes in `all`; `line_regex` becomes a
# `(?m)` regex with `\s` narrowed to `[ \t]`; nested any/all gates become
# alternations, `(?is)a.*b|b.*a` pairs or split rules; `whole_recent` becomes
# `lines = 200`; herdr's known-agent idle fallback is the explicit
# `idle_fallback` rule.

[agent]
kind = "generic"
display_name = "Kilo Code"
binaries = ["kilo", "kilo-code"]

[[screen]]
id = "opencode_permission"
state = "blocked"
priority = 300
lines = 200
regex = ['(?i)△ Permission required']

# herdr opencode_permission, second branch: a dialog footer with navigation.
[[screen]]
id = "opencode_permission_dialog"
state = "blocked"
priority = 300
lines = 200
all = ['(?i)esc dismiss', '(?i)enter (?:confirm|submit|toggle)', '(?i)↑↓ select|⇆ tab']

[[screen]]
id = "esc_interrupt_working"
state = "working"
priority = 100
lines = 200
regex = ['(?i)esc interrupt']

[[screen]]
id = "idle_fallback"
state = "idle"
priority = -1000
regex = ['']
